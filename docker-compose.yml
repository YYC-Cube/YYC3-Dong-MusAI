services:
  # 粉丝网站（Vite 8 构建 → Nginx）
  web:
    build:
      context: .
      dockerfile: web_app/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:4000
    ports:
      - "3000:80"
    depends_on:
      - api

  # 主 API 服务（PostgreSQL 15）
  api:
    build: ./api_service
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PGHOST=db
      - PGPORT=5432
      - PGDATABASE=yyc3_music
      - PGUSER=yanyu
      - PGPASSWORD=${PG_PASSWORD:?PG_PASSWORD is required}
      - PGSCHEMA=m98
      - FRONTEND_URL=http://localhost:3000
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_EXPIRES_IN=8h
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 主数据库 PostgreSQL 15
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=yyc3_music
      - POSTGRES_USER=yanyu
      - POSTGRES_PASSWORD=${PG_PASSWORD:?PG_PASSWORD is required}
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yanyu -d yyc3_music"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pg_data:

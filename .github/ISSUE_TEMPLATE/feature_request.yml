name: 功能建议
description: 提出新功能、体验优化或架构改进建议
title: '[Feature] '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        请先阅读 [README.md](https://github.com/YYC-Cube/YYC3-Dong-MusAI#readme) 与 [路线图](https://github.com/YYC-Cube/YYC3-Dong-MusAI#-路线图)，确认建议不与既有规划冲突。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前痛点是什么？影响哪些用户或场景？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的实现方式、交互或接口
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 涉及模块
      multiple: true
      options:
        - web_app 前端
        - api_service 后端
        - admin_panel 管理后台
        - 数据与迁移
        - CI / 部署
        - 文档
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否考虑过其他实现路径？
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 原型、参考链接、指标目标等
    validations:
      required: false

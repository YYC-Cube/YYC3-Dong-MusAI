name: 缺陷报告
description: 报告可复现的缺陷，帮助我们一起修复
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先搜索已有 Issue，避免重复提交。
        安全漏洞请勿公开提交，按 [SECURITY.md](https://github.com/YYC-Cube/YYC3-Dong-MusAI/blob/main/SECURITY.md) 私下报告。

  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 发生了什么？期望的结果是什么？
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 观察到 ...
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      multiple: true
      options:
        - web_app 前端
        - api_service 后端
        - admin_panel 管理后台
        - GitHub Pages 部署
        - CI / 构建
        - 文档
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 运行环境
      placeholder: 例如 macOS 15 / Node 20 / Chrome 130 / 线上 musai.yyc3.vip
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 请粘贴关键报错、控制台输出或截图
      render: shell
    validations:
      required: false

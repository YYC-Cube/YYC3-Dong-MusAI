name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'web_app/**'
      - 'public/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build · 静态站点构建
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web_app/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: web_app
        run: npm ci

      - name: Build
        working-directory: web_app
        run: npm run build
        env:
          CI: true

      - name: Verify CNAME
        run: |
          test -f web_app/build/CNAME
          test "$(tr -d '\r\n' < web_app/build/CNAME)" = "musai.yyc3.vip"
          echo '[pages] build/CNAME 校验通过'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web_app/build

  deploy:
    name: Deploy · 发布到 Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

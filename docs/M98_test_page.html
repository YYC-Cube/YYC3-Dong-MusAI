<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M98 董小姐 - 测试页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 3em;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.2em;
            color: rgba(255, 255, 255, 0.7);
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            -webkit-backdrop-filter: blur(10px); /* 兼容 Safari */
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .card h3 {
            margin-bottom: 20px;
            color: #4f46e5;
        }
        
        .btn {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            border: none;
            border-radius: 10px;
            padding: 12px 24px;
            color: white;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            margin: 10px 5px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.4);
        }
        
        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            margin-left: 10px;
        }
        
        .status.online {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }
        
        .status.offline {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        
        .output {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            white-space: pre-wrap;
            font-family: monospace;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .lyrics-output {
            background: rgba(79, 70, 229, 0.1);
            border-left: 4px solid #4f46e5;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            line-height: 1.8;
        }
        
        /* 新增：隐藏歌词输出初始状态 */
        #lyrics-output {
            display: none;
        }
        /* 新增：隐藏API输出初始状态 */
        #api-output {
            display: none;
        }
        /* 新增：隐藏数据库输出初始状态 */
        #db-output {
            display: none;
        }
        
        .footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>M98 董小姐</h1>
            <p>电子 × 东方 × 未来 - 专属音乐人应用测试页面</p>
        </div>
        
        <div class="grid">
            <!-- AI歌词生成器测试 -->
            <div class="card">
                <h3>🤖 AI歌词生成器 <span id="ai-status" class="status offline">离线</span></h3>
                <p>测试M98专属东方风格歌词生成功能</p>
                <button class="btn" onclick="testAIService()">生成歌词</button>
                <button class="btn" onclick="checkAIStatus()">检查状态</button>
                <div id="lyrics-output" class="lyrics-output"></div>
            </div>
            
            <!-- API服务测试 -->
            <div class="card">
                <h3>🔗 API服务测试 <span id="api-status" class="status offline">离线</span></h3>
                <p>测试后端API服务连接和数据获取</p>
                <button class="btn" onclick="testAPIHealth()">健康检查</button>
                <button class="btn" onclick="testArtistAPI()">获取艺术家信息</button>
                <div id="api-output" class="output"></div>
            </div>
            
            <!-- 前端组件测试 -->
            <div class="card">
                <h3>🎵 前端组件测试</h3>
                <p>测试React组件和用户界面</p>
                <button class="btn" onclick="openReactApp()">打开粉丝网站</button>
                <button class="btn" onclick="testLocalhost()">检查本地服务</button>
                <div id="frontend-status"></div>
            </div>
            
            <!-- 数据库连接测试 -->
            <div class="card">
                <h3>💾 数据库测试</h3>
                <p>测试MongoDB数据库连接和数据操作</p>
                <button class="btn" onclick="testDatabase()">连接测试</button>
                <button class="btn" onclick="seedTestData()">创建测试数据</button>
                <div id="db-output" class="output"></div>
            </div>
        </div>
        
        <div class="footer">
            <p>&copy; 2024 M98 董小姐专属音乐人应用 | 开发测试版本</p>
            <p>技术栈: React + Node.js + MongoDB + Python Flask</p>
        </div>
    </div>
    
    <script>
        // 检查AI服务状态
        async function checkAIStatus() {
            try {
                const response = await fetch('http://localhost:5001/health');
                if (response.ok) {
                    document.getElementById('ai-status').textContent = '在线';
                    document.getElementById('ai-status').className = 'status online';
                } else {
                    throw new Error('Service not responding');
                }
            } catch (error) {
                document.getElementById('ai-status').textContent = '离线';
                document.getElementById('ai-status').className = 'status offline';
            }
        }
        
        // 测试AI歌词生成
        async function testAIService() {
            const output = document.getElementById('lyrics-output');
            output.style.display = 'block';
            output.innerHTML = '正在生成歌词...';
            
            try {
                const response = await fetch('http://localhost:5001/generate-lyrics', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        theme: '东方未来',
                        style: 'fusion'
                    })
                });
                
                const data = await response.json();
                if (data.success) {
                    output.innerHTML = `
                        <h4>🎵 ${data.lyrics.title}</h4>
                        <div style="margin: 15px 0;">
                            <strong>[主歌]</strong><br>
                            ${data.lyrics.verses[0]}
                        </div>
                        <div style="margin: 15px 0;">
                            <strong>[副歌]</strong><br>
                            ${data.lyrics.chorus}
                        </div>
                        <small style="color: rgba(255,255,255,0.6);">
                            生成时间: ${new Date(data.timestamp).toLocaleString('zh-CN')}
                        </small>
                    `;
                }
            } catch (error) {
                output.innerHTML = '❌ AI服务连接失败: ' + error.message;
            }
        }
        
        // 测试API健康检查
        async function testAPIHealth() {
            const output = document.getElementById('api-output');
            output.style.display = 'block';
            output.textContent = '正在检查API服务...';
            
            try {
                const response = await fetch('http://localhost:4000/health');
                const data = await response.json();
                output.textContent = JSON.stringify(data, null, 2);
                document.getElementById('api-status').textContent = '在线';
                document.getElementById('api-status').className = 'status online';
            } catch (error) {
                output.textContent = '❌ API服务连接失败: ' + error.message;
                document.getElementById('api-status').textContent = '离线';
                document.getElementById('api-status').className = 'status offline';
            }
        }
        
        // 测试艺术家API
        async function testArtistAPI() {
            const output = document.getElementById('api-output');
            output.style.display = 'block';
            output.textContent = '正在获取艺术家信息...';
            
            try {
                const response = await fetch('http://localhost:4000/api/artist/profile');
                const data = await response.json();
                output.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                output.textContent = '❌ 获取艺术家信息失败: ' + error.message;
            }
        }
        
        // 打开React应用
        function openReactApp() {
            window.open('http://localhost:3000', '_blank');
        }
        
        // 测试本地服务
        async function testLocalhost() {
            const services = [
                { name: '前端应用', url: 'http://localhost:3000' },
                { name: 'API服务', url: 'http://localhost:4000' },
                { name: 'AI服务', url: 'http://localhost:5001' }
            ];
            
            let statusHTML = '<h4>服务状态检查:</h4>';
            for (const service of services) {
                try {
                    const response = await fetch(service.url);
                    statusHTML += `<p>✅ ${service.name}: 运行中</p>`;
                } catch (error) {
                    statusHTML += `<p>❌ ${service.name}: 离线</p>`;
                }
            }
            
            document.getElementById('frontend-status').innerHTML = statusHTML;
        }
        
        // 页面加载时检查服务状态
        window.onload = function() {
            checkAIStatus();
            testAPIHealth();
        };
    </script>
</body>
</html>
